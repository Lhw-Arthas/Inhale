# The release packages (packaging/): Inhale-x86_64.AppImage and Inhale-Setup-x64.exe, each with its build tools inside,
# built on Linux in the packaging image (packaging/linux/docker.sh, pulled from ghcr.io: pkg-image.yml), with SHA256SUMS.
# A v* tag publishes a release (a prerelease for -rc.N); a push to main, or Run workflow, makes the rolling "nightly"
# prerelease again at that commit.
# Nothing is signed. No game data is in either package or in this run.
name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      name: ${{ steps.v.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # (a tag's own name; otherwise nightly-<commits>-<commit>, as upstream names its nightlies)
      - id: v
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then name=$GITHUB_REF_NAME
          else name="nightly-$(git rev-list --count HEAD)-$(git rev-parse --short HEAD)"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version: $name"

  linux:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/pkg/dl
          key: pkg-dl-linux-${{ hashFiles('packaging/pins.txt') }}
      # (the LLVM release is 2 GB: room for it, unpacked, beside the build)
      - name: Disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h .
      # (the packaging image pkg-image.yml pushed for this Dockerfile; docker.sh builds it when there is none)
      - name: Packaging image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag=$(sha256sum packaging/linux/Dockerfile | cut -c1-16)
          echo "INHALE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inhale-pkg-build:$tag" >> "$GITHUB_ENV"
      - name: AppImage
        env:
          INHALE_VERSION: ${{ needs.version.outputs.name }}
        run: packaging/linux/docker.sh
      # (it starts with no FUSE, its --cli reaches make_game.py, and its compiler links a program against its sysroot)
      - name: Smoke test
        run: |
          A=work/pkg/Inhale-x86_64.AppImage
          "$A" --appimage-extract-and-run --cli --help | head -3
          (cd "$RUNNER_TEMP" && "$GITHUB_WORKSPACE/$A" --appimage-extract >/dev/null)
          R=$RUNNER_TEMP/squashfs-root/usr/lib/inhale
          printf '#include <stdio.h>\nint main(void){puts("ok");return 0;}\n' > "$RUNNER_TEMP/t.c"
          "$R/llvm/upstream/bin/clang" --sysroot="$R/sysroot" -fuse-ld=lld "$RUNNER_TEMP/t.c" -o "$RUNNER_TEMP/t"
          "$RUNNER_TEMP/t"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: work/pkg/Inhale-x86_64.AppImage
          if-no-files-found: error
          compression-level: 0

  windows:
    needs: version
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: work/pkg/dl
          key: pkg-dl-windows-${{ hashFiles('packaging/pins.txt') }}
      # (the packaging image pkg-image.yml pushed for this Dockerfile; docker.sh builds it when there is none)
      - name: Packaging image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          tag=$(sha256sum packaging/linux/Dockerfile | cut -c1-16)
          echo "INHALE_IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/inhale-pkg-build:$tag" >> "$GITHUB_ENV"
      - name: Installer
        env:
          INHALE_VERSION: ${{ needs.version.outputs.name }}
        run: packaging/linux/docker.sh windows
      # (the staged Python starts under Wine and reaches make_game.py)
      - name: Smoke test
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends wine64
          export WINEPREFIX="$RUNNER_TEMP/wine" WINEDEBUG=-all WINEDLLOVERRIDES="mscoree=;mshtml="
          cd work/pkg/win-stage
          "$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)" python/python.exe -I nx2/make_game.py --help | head -3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: work/pkg/Inhale-Setup-x64.exe
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [version, linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS and the notes
        env:
          NAME: ${{ needs.version.outputs.name }}
        run: |
          cd dist && sha256sum Inhale-x86_64.AppImage Inhale-Setup-x64.exe > SHA256SUMS && cat SHA256SUMS && cd ..
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD^ 2>/dev/null || true)
          {
            echo "Inhale $NAME ($(git rev-parse --short HEAD)). Unsigned: see the README, \"Play (no command line)\"."
            echo
            echo "Changes${last:+ since $last}:"
            echo
            git log --no-merges --format='- %s' ${last:+"$last"..HEAD} | head -200
          } > notes.md
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ needs.version.outputs.name }}
        run: |
          files=(dist/Inhale-x86_64.AppImage dist/Inhale-Setup-x64.exe dist/SHA256SUMS)
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            pre=(); [[ $GITHUB_REF_NAME == *-rc.* ]] && pre=(--prerelease)
            gh release create "$GITHUB_REF_NAME" "${pre[@]}" --verify-tag --title "Inhale $GITHUB_REF_NAME" \
              --notes-file notes.md "${files[@]}"
          else
            # (the rolling nightly: its release and tag made again at this commit, the old assets with them)
            gh release delete nightly --yes --cleanup-tag 2>/dev/null || true
            gh release create nightly --prerelease --target "$GITHUB_SHA" --title "Inhale nightly ($NAME)" \
              --notes-file notes.md "${files[@]}"
          fi
